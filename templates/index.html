<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NAVNEET TEXT EXTRACTION TOOL</title>
  <style>
    :root {
      --navy: #0b2545;
      --soft-bg: #f8fafc;
      --card-bg: #ffffff;
      --muted-gray: #64748b;
      --accent: #ff7a3d;
      --border: #e2e8f0;
      --success-green: #10b981;
      --radius: 12px;
      --shadow: 0 4px 15px rgba(0,0,0,0.05);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body { margin: 0; background: var(--soft-bg); color: var(--navy); line-height: 1.5; }

    header {
      width: 100%; background: var(--navy); color: white; padding: 18px;
      text-align: center; position: fixed; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 { margin: 0; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; }

    .page-wrap {
      max-width: 1200px; margin: 0 auto; padding: 100px 20px 60px;
      display: flex; flex-direction: column; align-items: center;
    }

    .upload-card {
      width: 100%; max-width: 480px; background: var(--card-bg);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 30px; text-align: center; margin-top: 40px;
    }
    .upload-card h2 { margin: 0 0 8px; font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 14px; color: var(--muted-gray); margin-bottom: 25px; }

    .mode-container {
      text-align: left; background: #f1f5f9; padding: 15px;
      border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--border);
    }
    .mode-container label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--muted-gray); }
    select {
      width: 100%; margin-top: 8px; padding: 10px; border-radius: 6px;
      border: 1px solid #cbd5e1; background: white; font-size: 14px; outline: none;
    }

    .dropzone {
      border-radius: 10px; padding: 40px 20px; border: 2px dashed #cbd5e1;
      cursor: pointer; background: #fff; transition: 0.2s;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .dropzone:hover { border-color: var(--accent); background: #fffaf8; }
    .dropzone.file-selected { border-color: var(--success-green); background: #f0fdfa; }
    
    .drop-icon { font-size: 32px; margin-bottom: 10px; }
    .drop-text { font-size: 15px; font-weight: 600; color: var(--navy); }
    #fileInfo { margin-top: 10px; font-size: 13px; color: var(--success-green); font-weight: 700; }

    input[type=file] { display: none; }

    .btn {
      display: block; width: 100%; margin-top: 20px; padding: 15px;
      border-radius: 8px; background: var(--accent); color: white;
      font-weight: 700; border: none; cursor: pointer; transition: 0.2s; font-size: 15px;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; }

    #resultArea { display: none; width: 100%; }
    
    .dashboard-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px;
    }

    .dual-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: start;
    }

    @media (max-width: 950px) {
      .dual-layout { grid-template-columns: 1fr; gap: 30px; }
    }

    .lane-label { 
      font-size: 12px; font-weight: 800; color: var(--muted-gray); 
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;
      display: flex; align-items: center; gap: 10px;
    }
    .lane-label::after { content: ""; height: 1px; background: var(--border); flex-grow: 1; }

    .table-card {
      background: white; border-radius: 8px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
      margin-bottom: 40px;
      overflow: hidden;
    }
    .table-header-flex {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--navy); padding: 10px 15px;
    }
    .table-card h3 { margin: 0; font-size: 14px; color: white; font-weight: 700; }
    
    .copy-pill {
      background: rgba(255,255,255,0.15); color: white; border: none;
      font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 4px;
      cursor: pointer; text-transform: uppercase; transition: 0.2s;
    }
    .copy-pill:hover { background: rgba(255,255,255,0.3); }

    table { width: 100%; border-collapse: collapse; }
    th { 
      text-align: left; padding: 8px 12px; background: #f8fafc; 
      font-size: 11px; text-transform: uppercase; color: var(--muted-gray);
      border-bottom: 1px solid var(--border);
    }
    td { padding: 6px 12px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
    
    .qty-cell { text-align: center; width: 60px; }
    .qty-badge {
      display: inline-block; min-width: 24px; padding: 2px 8px;
      border-radius: 4px; font-weight: 800; font-size: 12px;
      background: #fff7ed; color: #c2410c; border: 1px solid #ffedd5;
    }
    .qty-zero { background: #f1f5f9; color: #94a3b8; border-color: #e2e8f0; font-weight: 400; }

    .loading-overlay { display: none; margin: 20px 0; }
    .spinner {
      width: 30px; height: 30px; border: 3px solid #f3f3f3;
      border-top: 3px solid var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header><h1>NAVNEET TEXT EXTRACTION TOOL</h1></header>

  <main class="page-wrap">
    <div class="upload-card" id="uploadCard">
      <h2>Process Document</h2>
      <p class="subtitle">Extracting quantities with two-column precision.</p>

      <div class="mode-container">
        <label>Extraction Mode</label>
        <select id="modeSelect">
          <option value="extract">Code & Qty Extraction</option>
          <option value="transcribe">Handwriting OCR (.docx)</option>
        </select>
      </div>

      <input type="file" id="fileInput" accept="image/*,application/pdf" />
      <label for="fileInput" class="dropzone" id="dropzone">
        <div class="drop-icon">📂</div>
        <div class="drop-text" id="dropLabel">Click to Browse or Drop File</div>
        <div id="fileInfo"></div>
      </label>

      <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <div style="font-size:12px; font-weight: 600;">Analyzing Document Layout...</div>
      </div>

      <button id="submitBtn" class="btn" disabled>Start Extraction</button>
    </div>

    <div id="resultArea">
      <div class="dashboard-header">
        <h2 style="margin:0; font-size: 18px;">Extracted Data</h2>
        <button class="btn" style="margin:0; width:auto; padding:8px 20px; font-size:13px;" onclick="window.location.reload()">New Upload</button>
      </div>

      <div class="dual-layout">
        <div class="column-lane">
          <div class="lane-label">Left Column</div>
          <div id="leftColumnContainer"></div>
        </div>

        <div class="column-lane">
          <div class="lane-label">Right Column</div>
          <div id="rightColumnContainer"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const submitBtn = document.getElementById('submitBtn');
    const dropzone = document.getElementById('dropzone');
    const loader = document.getElementById('loader');

    fileInput.onchange = () => {
      if (fileInput.files[0]) {
        document.getElementById('fileInfo').textContent = "Selected: " + fileInput.files[0].name;
        document.getElementById('dropLabel').style.display = 'none';
        dropzone.classList.add('file-selected');
        submitBtn.disabled = false;
      }
    };

    submitBtn.onclick = async () => {
      const mode = document.getElementById('modeSelect').value;
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('mode', mode);

      submitBtn.style.display = 'none';
      loader.style.display = 'block';

      try {
        const response = await fetch('/upload', { method: 'POST', body: formData });
        if (mode === 'transcribe') {
          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = `Transcription_${Date.now()}.docx`;
          a.click();
          window.location.reload();
        } else {
          const data = await response.json();
          renderDashboard(data);
        }
      } catch (err) {
        alert("Extraction failed.");
        window.location.reload();
      }
    };

    function copyTable(tableId) {
        const table = document.getElementById(tableId);
        let text = "Code\tSubject\tQty\n";
        const rows = table.querySelectorAll('tbody tr');
        rows.forEach(row => {
            const cells = row.querySelectorAll('td');
            text += `${cells[0].innerText}\t${cells[1].innerText}\t${cells[2].innerText}\n`;
        });
        navigator.clipboard.writeText(text).then(() => {
            alert("Table data copied to clipboard!");
        });
    }

    function renderDashboard(data) {
      document.getElementById('uploadCard').style.display = 'none';
      document.getElementById('resultArea').style.display = 'block';

      const left = document.getElementById('leftColumnContainer');
      const right = document.getElementById('rightColumnContainer');

      data.forEach((section, index) => {
        const tableId = `table-${index}`;
        const tableHtml = `
          <div class="table-card">
            <div class="table-header-flex">
                <h3>${section.table_title}</h3>
                <button class="copy-pill" onclick="copyTable('${tableId}')">Copy Data</button>
            </div>
            <table id="${tableId}">
              <thead>
                <tr>
                  <th style="width:70px">Code</th>
                  <th>Subject</th>
                  <th class="qty-cell">Qty</th>
                </tr>
              </thead>
              <tbody>
                ${section.items.map(item => `
                  <tr>
                    <td style="font-family:monospace; font-weight:600;">${item.code}</td>
                    <td>${item.subject}</td>
                    <td class="qty-cell">
                      <span class="qty-badge ${item.qty == '0' ? 'qty-zero' : ''}">${item.qty}</span>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

        if (section.column_position === 'right_col') {
          right.insertAdjacentHTML('beforeend', tableHtml);
        } else {
          left.insertAdjacentHTML('beforeend', tableHtml);
        }
      });
    }
  </script>
</body>
</html>
