<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NAVNEET TEXT EXTRACTION TOOL</title>
  <style>
    :root {
      --navy: #0b2545;
      --soft-bg: #f8fafc;
      --card-bg: #ffffff;
      --muted-gray: #64748b;
      --accent: #ff7a3d;
      --dashed-blue: #cbd5e1;
      --success-green: #10b981;
      --radius: 12px;
      --shadow: 0 4px 15px rgba(0,0,0,0.05);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body { margin: 0; background: var(--soft-bg); color: var(--navy); line-height: 1.5; }

    header {
      width: 100%; background: var(--navy); color: white; padding: 18px;
      text-align: center; position: fixed; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 { margin: 0; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; }

    .page-wrap {
      max-width: 1400px; margin: 0 auto; padding: 100px 20px 60px;
      display: flex; flex-direction: column; align-items: center;
    }

    /* --- UPLOAD CARD --- */
    .upload-card {
      width: 100%; max-width: 500px; background: var(--card-bg);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 35px; text-align: center; margin-top: 40px;
    }
    .upload-card h2 { margin: 0 0 8px; font-size: 20px; }
    .subtitle { font-size: 14px; color: var(--muted-gray); margin-bottom: 25px; }

    .mode-container {
      text-align: left; background: #f1f5f9; padding: 15px;
      border-radius: 10px; margin-bottom: 20px; border: 1px solid #e2e8f0;
    }
    .mode-container label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--muted-gray); }
    select {
      width: 100%; margin-top: 8px; padding: 10px; border-radius: 6px;
      border: 1px solid var(--dashed-blue); background: white; font-size: 14px;
    }

    .dropzone {
      border-radius: 10px; padding: 30px; border: 2px dashed var(--dashed-blue);
      cursor: pointer; background: #fff; transition: 0.2s;
    }
    .dropzone:hover { border-color: var(--accent); background: #fffaf8; }
    .dropzone.file-selected { border-color: var(--success-green); background: #f0fdfa; }
    .drop-text { font-size: 14px; font-weight: 600; margin-top: 10px; }
    #fileInfo { margin-top: 8px; font-size: 12px; color: var(--success-green); font-weight: 700; }

    input[type=file] { display: none; }

    .btn {
      display: block; width: 100%; margin-top: 20px; padding: 14px;
      border-radius: 8px; background: var(--accent); color: white;
      font-weight: 700; border: none; cursor: pointer; transition: 0.2s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; }

    /* --- RESULTS DASHBOARD --- */
    #resultArea { display: none; width: 100%; }
    
    .dashboard-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 40px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px;
    }

    .dual-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px; /* Strong spacing between Left and Right columns */
      align-items: start;
    }

    @media (max-width: 900px) {
      .dual-layout { grid-template-columns: 1fr; gap: 20px; }
    }

    .column-lane { display: flex; flex-direction: column; }
    
    .lane-label { 
      font-size: 11px; font-weight: 800; color: var(--muted-gray); 
      text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px;
      background: #e2e8f0; padding: 6px 12px; border-radius: 4px; align-self: flex-start;
    }

    /* --- COMPACT TABLE CARDS --- */
    .table-card {
      background: white; border-radius: var(--radius);
      box-shadow: var(--shadow); border: 1px solid #e2e8f0;
      margin-bottom: 35px; /* Separation between stacked tables */
      overflow: hidden;
    }
    .table-card h3 { 
      margin: 0; padding: 12px 18px; font-size: 15px; 
      color: white; background: var(--navy); 
    }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { 
      text-align: left; padding: 10px 15px; background: #f8fafc; 
      font-size: 11px; text-transform: uppercase; color: var(--muted-gray);
      border-bottom: 1px solid #e2e8f0;
    }
    td { padding: 8px 15px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
    
    tr:hover td { background-color: #fcfcfc; }

    .qty-cell { text-align: center; width: 50px; }
    .qty-badge {
      display: inline-block; min-width: 28px; padding: 2px 6px;
      border-radius: 4px; font-weight: 700; font-size: 12px;
      background: #fff7ed; color: #c2410c; border: 1px solid #ffedd5;
    }
    .qty-zero { background: #f8fafc; color: #94a3b8; border-color: #e2e8f0; font-weight: 400; }

    /* --- LOADING --- */
    .loading-overlay { display: none; margin: 20px 0; }
    .spinner {
      width: 30px; height: 30px; border: 3px solid #f3f3f3;
      border-top: 3px solid var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header><h1>NAVNEET TEXT EXTRACTION TOOL</h1></header>

  <main class="page-wrap">
    <div class="upload-card" id="uploadCard">
      <h2>Process Document</h2>
      <p class="subtitle">Extracting quantities with two-column precision.</p>

      <div class="mode-container">
        <label>Mode</label>
        <select id="modeSelect">
          <option value="extract">Quantity Extraction (Visual Grid)</option>
          <option value="transcribe">Handwriting OCR (.docx)</option>
        </select>
      </div>

      <input type="file" id="fileInput" accept="image/*,application/pdf" />
      <label for="fileInput" class="dropzone" id="dropzone">
        <div class="drop-text" id="dropLabel">Browse or Drop File</div>
        <div id="fileInfo"></div>
      </label>

      <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <div style="font-size:12px; color:var(--muted-gray)">Processing Layout...</div>
      </div>

      <button id="submitBtn" class="btn" disabled>Run Extraction</button>
    </div>

    <div id="resultArea">
      <div class="dashboard-header">
        <h2 style="margin:0; font-size: 18px;">Extraction Results</h2>
        <button class="btn" style="margin:0; width:auto; padding:8px 20px; font-size:12px;" onclick="window.location.reload()">Start New</button>
      </div>

      <div class="dual-layout">
        <div class="column-lane">
          <div class="lane-label">Left Side of Paper</div>
          <div id="leftColumnContainer"></div>
        </div>

        <div class="column-lane">
          <div class="lane-label">Right Side of Paper</div>
          <div id="rightColumnContainer"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const submitBtn = document.getElementById('submitBtn');
    const dropzone = document.getElementById('dropzone');
    const loader = document.getElementById('loader');

    fileInput.onchange = () => {
      if (fileInput.files[0]) {
        document.getElementById('fileInfo').textContent = "File Ready: " + fileInput.files[0].name;
        document.getElementById('dropLabel').style.display = 'none';
        dropzone.classList.add('file-selected');
        submitBtn.disabled = false;
      }
    };

    submitBtn.onclick = async () => {
      const mode = document.getElementById('modeSelect').value;
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('mode', mode);

      submitBtn.style.display = 'none';
      loader.style.display = 'block';

      try {
        const response = await fetch('/upload', { method: 'POST', body: formData });
        
        if (mode === 'transcribe') {
          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = `OCR_Result.docx`;
          a.click();
          window.location.reload();
        } else {
          const data = await response.json();
          renderDashboard(data);
        }
      } catch (err) {
        alert("Error processing document.");
        window.location.reload();
      }
    };

    function renderDashboard(data) {
      document.getElementById('uploadCard').style.display = 'none';
      document.getElementById('resultArea').style.display = 'block';

      const left = document.getElementById('leftColumnContainer');
      const right = document.getElementById('rightColumnContainer');

      data.forEach(section => {
        const tableHtml = `
          <div class="table-card">
            <h3>${section.table_title}</h3>
            <table>
              <thead>
                <tr>
                  <th style="width:70px">Code</th>
                  <th>Subject</th>
                  <th class="qty-cell">Qty</th>
                </tr>
              </thead>
              <tbody>
                ${section.items.map(item => `
                  <tr>
                    <td style="font-family:monospace; color:#475569;">${item.code}</td>
                    <td style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${item.subject}</td>
                    <td class="qty-cell">
                      <span class="qty-badge ${item.qty == '0' ? 'qty-zero' : ''}">${item.qty}</span>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

        if (section.column_position === 'right_col') {
          right.insertAdjacentHTML('beforeend', tableHtml);
        } else {
          left.insertAdjacentHTML('beforeend', tableHtml);
        }
      });
    }
  </script>
</body>
</html>
