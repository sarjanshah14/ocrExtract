<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NAVNEET TEXT EXTRACTION TOOL</title>
  <style>
    :root{
      --navy: #0b2545; --soft-bg: #f3f7fb; --card-bg: #ffffff;
      --muted-gray: #8b9bb5; --accent: #ff7a3d; --accent-weak: rgba(255,122,61,0.12);
      --dashed-blue: #9ec5ff; --success-green: #388e3c;
      --radius: 14px; --shadow: 0 8px 24px rgba(11,37,69,0.08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    html,body{height:100%;margin:0;background:var(--soft-bg);padding:0;} 

    header{
      width:100%;background:var(--navy);color:white;padding:22px 16px;box-sizing:border-box;
      text-align:center;position:fixed;top:0;left:0;z-index:10;box-shadow: 0 2px 6px rgba(2,12,34,0.08);
    }
    header h1{margin:0;font-weight:800;letter-spacing:2px;font-size:14px;text-transform:uppercase;}

    .page-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:120px 20px 40px;box-sizing:border-box;}

    .card{width:100%;max-width:550px;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:42px 40px;box-sizing:border-box;text-align:center}
    .card h2{margin:0 0 10px;font-size:20px;color:#102a4a;font-weight:700}
    .subtitle{font-size:13px;color:var(--muted-gray);margin-bottom:26px}

    /* Selection Box */
    .mode-container {
        text-align: left; background: #f9fbff; border: 1px solid #e1e8f0;
        padding: 15px; border-radius: 10px; margin-bottom: 25px;
    }
    .mode-container label { font-size: 12px; font-weight: 700; color: var(--navy); text-transform: uppercase; }
    select { 
        width: 100%; margin-top: 8px; padding: 10px; border-radius: 6px; 
        border: 1px solid var(--dashed-blue); background: white; font-size: 14px; outline: none;
    }

    .dropzone{
      border-radius:10px;padding:34px 26px;border:2px dashed var(--dashed-blue);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:180px;cursor:pointer;transition:all .18s ease-in-out;
      background:linear-gradient(180deg, rgba(158,197,255,0.04) 0%, rgba(255,255,255,0) 100%);
    }
    .dropzone.dragover{border-color:var(--accent); transform:translateY(-2px)}
    .dropzone.file-selected { border-color: var(--success-green); background: rgba(56, 142, 60, 0.04); }

    .drop-icon{width:48px;height:48px;margin-bottom:12px;opacity:0.8}
    .drop-text{font-size:15px;color:#16324a;font-weight:600}

    input[type=file]{display:none}
    .file-info{margin-top:14px;font-size:13px;color:var(--muted-gray);min-height: 36px;} 

    .btn{
      display:inline-block;margin-top:20px;padding:14px 28px;border-radius:999px;
      background:var(--accent);color:white;font-weight:700;border:none;cursor:pointer;
      font-size:15px;width: 100%; transition: 0.2s;
    }
    .btn:disabled{opacity:0.4;cursor:not-allowed;}
    .btn:hover:not(:disabled) { background: #e66a33; }

    /* Results UI */
    #resultArea { display: none; width: 100%; max-width: 800px; margin-top: 20px; }
    .table-card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th { text-align: left; padding: 12px; background: #f8fafc; border-bottom: 2px solid #e2e8f0; color: var(--navy); font-size: 13px; }
    td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
    .qty-highlight { background: #fff7ed; color: #9a3412; font-weight: 700; padding: 4px 10px; border-radius: 6px; border: 1px solid #ffedd5; }

    .spinner {
      border: 4px solid #f3f3f3; border-top: 4px solid var(--navy); border-radius: 50%;
      width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 25px auto; display: none;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #processingMessage { display: none; color: var(--navy); font-weight: 600; margin-bottom: 10px; }
  </style>
</head>
<body>
  <header><h1>NAVNEET TEXT EXTRACTION TOOL</h1></header>

  <main class="page-wrap">
    <div class="card" id="uploadCard">
      <h2>Process Document</h2>
      <div class="subtitle">Extract data from Navneet Indent Forms</div>

      <div class="mode-container">
          <label>Extraction Mode</label>
          <select id="modeSelect">
              <option value="extract">Code & Quantity Extraction (View Tables)</option>
              <option value="transcribe">Full Script Transcription (Download Word)</option>
          </select>
      </div>

      <input id="fileInput" type="file" accept="image/*,application/pdf" />
      <label id="dropzone" class="dropzone" for="fileInput">
        <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
        </svg>
        <div class="drop-text" id="dropLabel">Click to Browse or Drag File</div>
        <div class="file-info" id="fileInfo"></div>
      </label>

      <div class="spinner" id="loader"></div>
      <div id="processingMessage">Analyzing document pages...</div>
      
      <button id="submitBtn" class="btn" disabled>Start Extraction</button>
    </div>

    <div id="resultArea">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h2 style="margin:0; color:var(--navy);">Extracted Data</h2>
            <button onclick="window.location.reload()" class="btn" style="margin:0; width:auto; padding:8px 20px;">New Scan</button>
        </div>
        <div id="tableContainer"></div>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const fileInfo = document.getElementById('fileInfo');
    const submitBtn = document.getElementById('submitBtn');
    const modeSelect = document.getElementById('modeSelect');
    const loader = document.getElementById('loader');
    const uploadCard = document.getElementById('uploadCard');
    const resultArea = document.getElementById('resultArea');

    // Drag and Drop Logic
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if(e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            handleFileSelect();
        }
    });

    fileInput.onchange = handleFileSelect;

    function handleFileSelect() {
        const file = fileInput.files[0];
        if(file) {
            fileInfo.innerHTML = `<strong>Selected:</strong> ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;
            dropzone.classList.add('file-selected');
            document.getElementById('dropLabel').style.display = 'none';
            submitBtn.disabled = false;
        }
    }

    submitBtn.onclick = async () => {
        const mode = modeSelect.value;
        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append('file', file);
        formData.append('mode', mode);

        // UI State: Loading
        submitBtn.style.display = 'none';
        loader.style.display = 'block';
        document.getElementById('processingMessage').style.display = 'block';

        try {
            const res = await fetch('/upload', { method: 'POST', body: formData });
            
            if (mode === 'transcribe') {
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name.split('.')[0] + "_Transcription.docx";
                document.body.appendChild(a);
                a.click();
                window.location.reload();
            } else {
                const data = await res.json();
                renderTables(data);
            }
        } catch (err) {
            alert("Extraction failed. Please check the API Key or file format.");
            console.error(err);
            window.location.reload();
        }
    };

    function renderTables(data) {
        uploadCard.style.display = 'none';
        resultArea.style.display = 'block';
        const container = document.getElementById('tableContainer');
        container.innerHTML = '';

        if(!data || data.length === 0) {
            container.innerHTML = '<div class="table-card">No handwritten quantities detected.</div>';
            return;
        }

        data.forEach(section => {
            let html = `
                <div class="table-card">
                    <h3 style="margin-top:0; color:var(--accent); font-size:18px;">${section.table_title}</h3>
                    <table>
                        <thead>
                            <tr><th>Code</th><th>Subject Name</th><th style="text-align:center;">Qty</th></tr>
                        </thead>
                        <tbody>
            `;
            section.items.forEach(item => {
                html += `
                    <tr>
                        <td style="font-family:monospace; font-weight:600;">${item.code}</td>
                        <td>${item.subject}</td>
                        <td style="text-align:center;"><span class="qty-highlight">${item.qty}</span></td>
                    </tr>
                `;
            });
            html += `</tbody></table></div>`;
            container.innerHTML += html;
        });
    }
  </script>
</body>
</html>
